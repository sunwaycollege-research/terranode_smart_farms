# TERANODE — Nginx dev reverse proxy.
# Serves a placeholder at / and proxies /api -> the API host (host.docker.internal:4000).
# The API runs on the host via tsx during dev (PORT=4000).

upstream teranode_api {
    server host.docker.internal:4000;
}

server {
    listen 80;
    server_name _;

    # Reverse-proxy REST under /api -> API (strip the /api prefix).
    location /api/ {
        proxy_pass http://teranode_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (WS /live?token=JWT is mounted under the API).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Dev placeholder landing page.
    location / {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>TERANODE</title></head><body><h1>TERANODE</h1><p>Dev gateway online. API is proxied under <code>/api</code>.</p></body></html>';
    }
}

# TERANODE — Mosquitto 2.x dev config (anonymous; NOT for production)
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Allow anonymous connections for the hardware-free dev stack.
allow_anonymous true

# MQTT over TCP (ingest worker + virtual gateway connect here).
listener 1883
protocol mqtt

# MQTT over WebSockets (browser/dev tooling).
listener 9001
protocol websockets
